<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoResolve-AI - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #f5f5f5 0%, #e8e8e8 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #1a1a1a;
        }

        .login-box {
            background: white;
            border: 2px solid #829CBC;
            border-radius: 12px;
            padding: 48px 40px;
            text-align: center;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 2px 8px rgba(31, 72, 126, 0.1);
        }

        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .logo svg {
            width: 48px;
            height: 48px;
        }

        .brand-name {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 8px;
            color: #1F487E;
        }

        .tagline {
            color: #666666;
            margin-bottom: 40px;
            font-size: 13px;
        }

        .form-group {
            margin-bottom: 16px;
            text-align: left;
        }

        .form-label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 13px;
            color: #1a1a1a;
        }

        .form-control {
            width: 100%;
            padding: 12px 16px;
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            color: #1a1a1a;
            font-size: 13px;
            transition: all 0.3s;
        }

        .form-control:focus {
            outline: none;
            border-color: #1F487E;
            box-shadow: 0 0 0 3px rgba(31, 72, 126, 0.1);
        }

        .role-options {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
            margin-bottom: 24px;
        }

        .role-option {
            padding: 12px;
            background: #f9f9f9;
            border: 2px solid #829CBC;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            font-weight: 600;
            font-size: 11px;
            transition: all 0.3s;
            color: #1a1a1a;
        }

        .role-option:hover {
            border-color: #1F487E;
            background: rgba(31, 72, 126, 0.05);
        }

        .role-option.selected {
            background: #1F487E;
            border-color: #1F487E;
            color: white;
        }

        .btn {
            padding: 14px 24px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #1F487E;
            color: white;
            width: 100%;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(102, 126, 234, 0.4);
        }

        .links-row {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            font-size: 12px;
        }

        .links-row a {
            color: #667eea;
            text-decoration: none;
            cursor: pointer;
        }

        .links-row a:hover {
            text-decoration: underline;
            color: #764ba2;
        }

        .brand-name {
            transition: all 0.3s ease;
            position: relative;
            display: inline-block;
        }

        .ai-text {
            position: relative;
            display: inline-block;
        }

        .ai-dot {
            position: absolute;
            width: 10px;
            height: 10px;
            background: #ffc107;
            border-radius: 50%;
            top: -12px;
            right: -8px;
            animation: float-up 3s ease-in-out infinite;
            box-shadow: 0 0 8px rgba(255, 193, 7, 0.6);
        }

        @keyframes float-up {
            0%, 100% {
                transform: translateY(0);
                opacity: 1;
            }
            50% {
                transform: translateY(-10px);
                opacity: 0.8;
            }
        }

    </style>
</head>
<body>
    <div class="login-box">
        <div class="brand-name">AutoResolve-<span class="ai-text" style="color: #ffc107;">AI<div class="ai-dot"></div></span></div>
        <div class="tagline">IT Support Automation Platform</div>

        <div class="form-group">
            <label class="form-label">Username</label>
            <input type="text" class="form-control" id="username" placeholder="john.smith" />
        </div>

        <div class="form-group">
            <label class="form-label">Password</label>
            <input type="password" class="form-control" id="password" placeholder="••••••••" />
        </div>

        <button class="btn btn-primary" onclick="login()">Sign In</button>
    </div>

    <script>
        function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            if (!username || !password) {
                alert('⚠️ Please enter username and password');
                return;
            }

            alert(`✅ Login successful!\n\nUsername: ${username}\n\nNext: Open set-password.html`);
        }
    </script>
</body>
</html>
