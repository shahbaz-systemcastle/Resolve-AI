<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoResolve-AI - Forgot Password</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #f5f5f5 0%, #e8e8e8 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #1a1a1a;
        }

        .forgot-box {
            background: white;
            border: 2px solid #829CBC;
            border-radius: 12px;
            padding: 48px 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 2px 8px rgba(31, 72, 126, 0.1);
        }

        .icon-box {
            font-size: 48px;
            margin-bottom: 24px;
        }

        .title {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 8px;
            color: #1F487E;
        }

        .subtitle {
            color: #666666;
            margin-bottom: 32px;
            font-size: 13px;
            line-height: 1.6;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 13px;
            color: #1a1a1a;
        }

        .form-control {
            width: 100%;
            padding: 12px 16px;
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            color: #1a1a1a;
            font-size: 13px;
            transition: all 0.3s;
        }

        .form-control:focus {
            outline: none;
            border-color: #1F487E;
            box-shadow: 0 0 0 3px rgba(31, 72, 126, 0.1);
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #1F487E;
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(31, 72, 126, 0.4);
        }

        .code-input-group {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-top: 12px;
        }

        .code-input {
            width: 100%;
            padding: 12px;
            background: #131820;
            border: 1px solid #2d3748;
            border-radius: 8px;
            color: #e4e6eb;
            text-align: center;
            font-weight: 600;
            font-size: 20px;
            transition: all 0.3s;
        }

        .code-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .info-box {
            background: #1a2635;
            border-left: 4px solid #4299e1;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 20px;
            font-size: 12px;
            color: #cbd5e0;
            display: none;
        }

        .info-box.show {
            display: block;
        }

        .brand-name {
            position: relative;
            display: inline-block;
            font-size: 28px;
            font-weight: 800;
            color: #1F487E;
            margin-bottom: 8px;
        }

        .ai-text {
            position: relative;
            display: inline-block;
        }

        .ai-dot {
            position: absolute;
            width: 10px;
            height: 10px;
            background: #ffc107;
            border-radius: 50%;
            top: -12px;
            animation: float-up 3s ease-in-out infinite;
            box-shadow: 0 0 8px rgba(255, 193, 7, 0.6);
        }

        @keyframes float-up {
            0%, 100% {
                transform: translateY(0);
                opacity: 1;
            }
            50% {
                transform: translateY(-10px);
                opacity: 0.8;
            }
        }
    </style>
</head>
<body>
    <div class="forgot-box">
        <div class="title">Forgot Your Password?</div>
        <div class="subtitle">No problem! We'll help you reset it in a few simple steps.</div>

        <div id="emailSection">
            <div class="form-group">
                <label class="form-label">Email Address</label>
                <input type="email" class="form-control" id="email" placeholder="john.smith@company.com" />
            </div>
            <button class="btn btn-primary" onclick="sendCode()">Send Verification Code</button>
        </div>

        <div id="codeSection" style="display: none;">
            <div class="info-box show">
                📧 We've sent a 4-digit code to your email. Enter it below.
            </div>
            <div class="form-group">
                <label class="form-label">Verification Code</label>
                <div class="code-input-group">
                    <input type="text" class="code-input" maxlength="1" onkeyup="moveToNext(this)" />
                    <input type="text" class="code-input" maxlength="1" onkeyup="moveToNext(this)" />
                    <input type="text" class="code-input" maxlength="1" onkeyup="moveToNext(this)" />
                    <input type="text" class="code-input" maxlength="1" onkeyup="moveToNext(this)" />
                </div>
            </div>
            <button class="btn btn-primary" onclick="verifyCode()" style="margin-top: 20px;">Verify Code</button>
        </div>
    </div>

    <script>
        function sendCode() {
            const email = document.getElementById('email').value;
            if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                alert('⚠️ Please enter a valid email address');
                return;
            }
            alert('📧 Verification code sent!\n\nDemo code: 1234');
            document.getElementById('emailSection').style.display = 'none';
            document.getElementById('codeSection').style.display = 'block';
        }

        function moveToNext(input) {
            if (input.value.length === 1 && /[0-9]/.test(input.value)) {
                const next = input.nextElementSibling;
                if (next) next.focus();
            }
        }

        function verifyCode() {
            const inputs = document.querySelectorAll('.code-input');
            const code = Array.from(inputs).map(i => i.value).join('');
            if (code.length !== 4) {
                alert('⚠️ Please enter all 4 digits');
                return;
            }
            alert('✅ Code verified!\n\nNext: Open set-password.html to create a new password');
        }
    </script>
</body>
</html>
