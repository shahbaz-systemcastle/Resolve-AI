<svg width="200" height="100" viewBox="0 0 200 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="200" height="100" fill="none"/>

  <!-- Mountain peaks (Dark Gray) -->
  <path d="M 20 75 L 45 35 L 70 60 L 85 40 L 110 75" stroke="#2d3748" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Upward Arrow (Orange) -->
  <g>
    <!-- Arrow shaft -->
    <line x1="130" y1="75" x2="130" y2="20" stroke="#ff8c42" stroke-width="7" stroke-linecap="round"/>
    <!-- Arrow head -->
    <polygon points="130,15 118,32 142,32" fill="#ff8c42"/>
  </g>

  <!-- Circuit dots (Orange) -->
  <circle cx="40" cy="60" r="6" fill="#ff8c42"/>
  <circle cx="65" cy="75" r="6" fill="#ff8c42"/>
  <circle cx="90" cy="65" r="6" fill="#ff8c42"/>

  <!-- Circuit connecting lines (Orange) -->
  <line x1="40" y1="60" x2="65" y2="75" stroke="#ff8c42" stroke-width="3" opacity="0.8" stroke-linecap="round"/>
  <line x1="65" y1="75" x2="90" y2="65" stroke="#ff8c42" stroke-width="3" opacity="0.8" stroke-linecap="round"/>
</svg>