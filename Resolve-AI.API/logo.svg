<svg width="200" height="120" viewBox="0 0 200 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="200" height="120" fill="none"/>

  <!-- Mountain peaks (Dark Gray) -->
  <path d="M 30 85 L 55 45 L 80 70 L 95 50 L 120 85" stroke="#2d3748" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Upward Arrow (Orange) -->
  <g>
    <!-- Arrow shaft -->
    <line x1="140" y1="85" x2="140" y2="25" stroke="#ff8c42" stroke-width="6" stroke-linecap="round"/>
    <!-- Arrow head -->
    <polygon points="140,20 130,35 150,35" fill="#ff8c42"/>
  </g>

  <!-- Circuit dots (Orange) -->
  <circle cx="50" cy="70" r="5" fill="#ff8c42"/>
  <circle cx="75" cy="85" r="5" fill="#ff8c42"/>
  <circle cx="100" cy="75" r="5" fill="#ff8c42"/>

  <!-- Circuit connecting lines (Orange) -->
  <line x1="50" y1="70" x2="75" y2="85" stroke="#ff8c42" stroke-width="3" opacity="0.8" stroke-linecap="round"/>
  <line x1="75" y1="85" x2="100" y2="75" stroke="#ff8c42" stroke-width="3" opacity="0.8" stroke-linecap="round"/>

  <!-- Text: AutoResolve-AI -->
  <text x="105" y="110" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2d3748">AutoResolve-AI</text>
</svg>