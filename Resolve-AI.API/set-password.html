<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoResolve-AI - Set Password</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #f5f5f5 0%, #e8e8e8 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #1a1a1a;
        }

        .set-password-box {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            padding: 48px 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
        }

        .title {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 8px;
            color: #1a1a1a;
        }

        .subtitle {
            color: #666666;
            margin-bottom: 32px;
            font-size: 13px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 13px;
            color: #1a1a1a;
        }

        .form-control {
            width: 100%;
            padding: 12px 16px;
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            color: #1a1a1a;
            font-size: 13px;
            transition: all 0.3s;
        }

        .form-control:focus {
            outline: none;
            border-color: #1F487E;
            box-shadow: 0 0 0 3px rgba(31, 72, 126, 0.1);
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
            background: #1F487E;
            color: white;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(31, 72, 126, 0.4);
        }
    </style>
</head>
<body>
    <div class="set-password-box">
        <div style="text-align: center; margin-bottom: 24px;">
            <svg width="48" height="48" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" style="margin: 0 auto;">
                <path d="M 15 65 L 50 25 L 85 65" stroke="#2d3748" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M 65 28 L 80 12 M 80 12 L 80 32 M 80 12 L 60 12" stroke="#ff8c42" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                <polygon points="80,12 75,20 85,18" fill="#ff8c42"/>
                <circle cx="40" cy="50" r="3" fill="#ff8c42"/>
                <circle cx="50" cy="68" r="3" fill="#ff8c42"/>
                <circle cx="60" cy="50" r="3" fill="#ff8c42"/>
                <line x1="40" y1="50" x2="50" y2="68" stroke="#ff8c42" stroke-width="2" opacity="0.7"/>
                <line x1="50" y1="68" x2="60" y2="50" stroke="#ff8c42" stroke-width="2" opacity="0.7"/>
            </svg>
        </div>
        <div class="title">Set New Password</div>
        <div class="subtitle">Enter your new password</div>

        <div class="form-group">
            <label class="form-label">New Password</label>
            <input type="password" class="form-control" id="newPassword" placeholder="••••••••" />
        </div>

        <div class="form-group">
            <label class="form-label">Confirm Password</label>
            <input type="password" class="form-control" id="confirmPassword" placeholder="••••••••" />
        </div>

        <button class="btn" onclick="submitPassword()">Set Password</button>
    </div>

    <script>
        function submitPassword() {
            const pwd = document.getElementById('newPassword').value;
            const confirmPwd = document.getElementById('confirmPassword').value;

            if (!pwd || !confirmPwd) {
                alert('Warning: Please fill in both password fields');
                return;
            }

            if (pwd !== confirmPwd) {
                alert('Warning: Passwords do not match');
                return;
            }

            alert('Success: Password set successfully!\n\nNext: Open your dashboard\n- Employee: employee-dashboard.html\n- HelpDesk: helpdesk-dashboard.html\n- Admin: admin-dashboard.html');
        }
    </script>
</body>
</html>
