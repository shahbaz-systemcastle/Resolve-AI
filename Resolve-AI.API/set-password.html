<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoResolve-AI - Set Password</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #f5f5f5 0%, #e8e8e8 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #1a1a1a;
        }

        .set-password-box {
            background: white;
            border: 2px solid #829CBC;
            border-radius: 12px;
            padding: 48px 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 2px 8px rgba(31, 72, 126, 0.1);
        }

        .title {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 8px;
            color: #1F487E;
        }

        .subtitle {
            color: #666666;
            margin-bottom: 32px;
            font-size: 13px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 13px;
            color: #1a1a1a;
        }

        .form-control {
            width: 100%;
            padding: 12px 16px;
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            color: #1a1a1a;
            font-size: 13px;
            transition: all 0.3s;
        }

        .form-control:focus {
            outline: none;
            border-color: #1F487E;
            box-shadow: 0 0 0 3px rgba(31, 72, 126, 0.1);
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
            background: #1F487E;
            color: white;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(31, 72, 126, 0.4);
        }

        .brand-name {
            position: relative;
            display: inline-block;
            font-size: 28px;
            font-weight: 800;
            color: #1F487E;
            margin-bottom: 8px;
            text-align: center;
            width: 100%;
        }

        .tagline {
            color: #666666;
            font-size: 13px;
        }

        .ai-text {
            position: relative;
            display: inline-block;
        }

        .ai-dot {
            position: absolute;
            width: 10px;
            height: 10px;
            background: #ffc107;
            border-radius: 50%;
            top: -12px;
            animation: float-up 3s ease-in-out infinite;
            box-shadow: 0 0 8px rgba(255, 193, 7, 0.6);
        }

        @keyframes float-up {
            0%, 100% {
                transform: translateY(0);
                opacity: 1;
            }
            50% {
                transform: translateY(-10px);
                opacity: 0.8;
            }
        }
    </style>
</head>
<body>
    <div class="set-password-box">
        <div class="brand-name">AutoResolve-<span class="ai-text" style="color: #ffc107;">AI<div class="ai-dot" style="left: 50%; transform: translateX(-50%);"></div></span></div>
        <div class="tagline" style="margin-bottom: 32px;">IT Support Automation Platform</div>

        <div class="form-group">
            <label class="form-label">New Password</label>
            <input type="password" class="form-control" id="newPassword" placeholder="••••••••" />
        </div>

        <div class="form-group">
            <label class="form-label">Confirm Password</label>
            <input type="password" class="form-control" id="confirmPassword" placeholder="••••••••" />
        </div>

        <button class="btn" onclick="submitPassword()">Set Password</button>
    </div>

    <script>
        function submitPassword() {
            const pwd = document.getElementById('newPassword').value;
            const confirmPwd = document.getElementById('confirmPassword').value;

            if (!pwd || !confirmPwd) {
                alert('Warning: Please fill in both password fields');
                return;
            }

            if (pwd !== confirmPwd) {
                alert('Warning: Passwords do not match');
                return;
            }

            alert('Success: Password set successfully!\n\nNext: Open your dashboard\n- Employee: employee-dashboard.html\n- HelpDesk: helpdesk-dashboard.html\n- Admin: admin-dashboard.html');
        }
    </script>
</body>
</html>
